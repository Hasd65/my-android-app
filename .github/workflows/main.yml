name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build both apps
        run: ./gradlew assembleDebug || gradle --no-daemon :phone:assembleDebug :watch:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: phone/build/outputs/apk/debug/phone-debug.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: watch/build/outputs/apk/debug/watch-debug.apk
